name: Vainah VPN native engine libraries (integration artifacts)

on:
  push:
    branches:
      - feature/vpn-scale-control-plane-foundation
    paths:
      - ".github/workflows/engine-libraries.yml"
  workflow_dispatch:

permissions:
  contents: read

# Source-built upstream GPL-3.0 libraries, not installable VainahVPN apps.
# Must NOT be published as a finished VPN client.
jobs:
  android-libbox:
    name: Build libbox AAR for Android arm64 (integration only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Obtain pinned upstream sing-box source
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: 7054cac5124465ffdb145870d7c01885566711b1
          path: upstream
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache: false
      - name: Install pinned upstream gomobile tools
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          "$(go env GOPATH)/bin/gomobile" init
      - name: Omit NaiveProxy/Cronet from VLESS Reality Android library
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("upstream/cmd/internal/build_libbox/main.go")
          original = path.read_text()
          token = '"with_naive_outbound", '
          if original.count(token) != 1:
              raise SystemExit("Unexpected upstream build tags; refusing to patch")
          path.write_text(original.replace(token, ""))
          PY
      - name: Build Android arm64 library
        working-directory: upstream
        run: go run ./cmd/internal/build_libbox -target android -platform android/arm64
      - name: Verify Android client can link the generated AAR
        run: |
          mkdir -p native/android/app/libs
          cp upstream/libbox.aar native/android/app/libs/libbox.aar
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compile Android client with bundled native core (VPN remains disabled)
        run: gradle -p native/android :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Retain upstream license with native library
        run: cp upstream/LICENSE upstream/LIBBOX-LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: libbox-android-arm64-1.14.3-gpl-source-build
          path: |
            upstream/libbox.aar
            upstream/LIBBOX-LICENSE.txt
          if-no-files-found: error
          retention-days: 3

  apple-libbox:
    name: Build libbox XCFramework for iOS simulator and device
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Obtain pinned upstream sing-box source
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: 7054cac5124465ffdb145870d7c01885566711b1
          path: upstream
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache: false
      - name: Install pinned upstream gomobile tools
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          "$(go env GOPATH)/bin/gomobile" init
      - name: Build Apple iOS libbox XCFramework
        working-directory: upstream
        run: go run ./cmd/internal/build_libbox -target apple -platform ios,iossimulator
      - name: Prepare native iOS extension with real libbox framework
        run: python3 native/ios/scripts/link-libbox-preview.py upstream/Libbox.xcframework
      - name: Generate native iOS project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          swift native/ios/scripts/generate-icon.swift
          cd native/ios && xcodegen generate
      - name: Compile iOS extension with libbox linked (VPN remains disabled)
        run: >
          xcodebuild -project native/ios/VainahVPN.xcodeproj
          -scheme VainahVPN -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Retain upstream license with native library
        run: cp upstream/LICENSE upstream/LIBBOX-LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: libbox-apple-ios-1.14.3-gpl-source-build
          path: |
            upstream/Libbox.xcframework
            upstream/LIBBOX-LICENSE.txt
          if-no-files-found: error
          retention-days: 3

# These AAR/XCFramework files are engine prerequisites, not permission,
# routing or packet forwarding in Vainah VPN itself. No secrets are used,
# no release is created, and production deployments are unchanged.
