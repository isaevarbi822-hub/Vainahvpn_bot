name: Vainah VPN Android H1Cloud import hotfix

on:
  push:
    branches:
      - fix/android-h1-server-refresh-20261025
    paths:
      - "native/android/**"
      - ".github/workflows/android-h1-import-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-hotfix:
    name: Android H1Cloud import + libbox preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile and run Android regression tests
        run: >-
          gradle -p native/android
          -PvainahEnableLibbox=true
          -PvainahIsolatedPreview=true
          :app:assembleDebug :app:testDebugUnitTest
          --no-daemon --stacktrace
      - name: Upload isolated Android hotfix APK
        uses: actions/upload-artifact@v4
        with:
          name: VainahVPN-Android-0.5.6-H1Cloud-server-import-preview
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
