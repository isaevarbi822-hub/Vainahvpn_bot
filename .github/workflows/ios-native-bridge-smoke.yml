name: Vainah iOS native libbox bridge smoke (temporary integration)

on:
  push:
    branches:
      - feature/vpn-scale-control-plane-foundation
    paths:
      - "native/ios/**"
      - ".github/workflows/ios-native-bridge-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vainah-ios-native-smoke
  cancel-in-progress: true

jobs:
  compile-real-apple-libbox-bridge:
    name: Check PacketTunnel imports and native libbox configuration validator
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Only a short-lived CI smoke test: pinned source-built libbox 1.14.3,
      # never used to publish or sign an iOS application.
      - name: Download prior pinned libbox XCFramework
        uses: actions/download-artifact@v4
        with:
          name: libbox-apple-ios-1.14.3-gpl-source-build
          run-id: 39485709341
          github-token: ${{ github.token }}
          path: upstream
      - name: Link native framework into PacketTunnel extension
        run: |
          test -d upstream/Libbox.xcframework
          python3 native/ios/scripts/link-libbox-preview.py upstream/Libbox.xcframework
      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          swift native/ios/scripts/generate-icon.swift
          cd native/ios && xcodegen generate
      - name: Build iOS simulator extension with real libbox validator
        run: >
          xcodebuild -project native/ios/VainahVPN.xcodeproj
          -scheme VainahVPN
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      # Does NOT prove packet forwarding, DNS, IPv6 or a usable signed app.
