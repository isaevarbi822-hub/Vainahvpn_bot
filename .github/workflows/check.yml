name: Vainah VPN checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check function syntax
        run: |
          node --check netlify/functions/lib/security.mjs
          node --check netlify/functions/rollypay-test.mjs
          node --check netlify/functions/rollypay-webhook.mjs
      - name: Run sandbox tests
        run: npm test
