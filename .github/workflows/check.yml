name: Vainah VPN checks

on:
  push:
    branches: [main, feature/telegram-linked-checkout]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check function syntax
        run: |
          node --check netlify/functions/lib/security.mjs
          node --check netlify/functions/rollypay-test.mjs
          node --check netlify/functions/rollypay-webhook.mjs
      - name: Check unified subscription function syntax
        run: |
          for file in netlify/functions/lib/*.mjs netlify/functions/*.mjs; do node --check "$file"; done
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run tests
        run: npm test
