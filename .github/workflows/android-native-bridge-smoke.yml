name: Vainah Android native bridge smoke (temporary integration)

on:
  push:
    branches:
      - feature/vpn-scale-control-plane-foundation
    paths:
      - "native/android/**"
      - ".github/workflows/android-native-bridge-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vainah-android-native-smoke
  cancel-in-progress: true

jobs:
  compile-real-libbox-bridge:
    name: Compile VpnService bridge against source-built libbox
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      # Temporary speedup while the full pinned-source rebuild is running.
      # Artifact built from pinned official sing-box 1.14.3 source, expires
      # after three days; never used by any distributed release.
      - name: Download prior pinned libbox AAR for compile check only
        uses: actions/download-artifact@v4
        with:
          name: libbox-android-arm64-1.14.3-gpl-source-build
          run-id: 39485709341
          github-token: ${{ github.token }}
          path: native/android/app/libs
      - name: Compile real bridge and native Android tests
        run: |
          test -s native/android/app/libs/libbox.aar
          gradle -p native/android :app:assembleDebug :app:testDebugUnitTest --no-daemon
      # No artifact upload, release or deployment; source compilation
      # does not prove protected forwarding, DNS or IPv6 behavior.
