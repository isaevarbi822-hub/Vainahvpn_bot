name: Vainah VPN Desktop Windows macOS preview

on:
  push:
    branches:
      - feature/native-ios-android-vpn-foundation
    paths:
      - "desktop/**"
      - "tests/native-desktop-preview.test.mjs"
      - ".github/workflows/desktop-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vainah-desktop-ui-preview
  cancel-in-progress: false

jobs:
  safety:
    name: Desktop source, design and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check desktop JS syntax
        run: |
          for file in desktop/src/*.cjs desktop/shared/*.cjs desktop/ui/*.js desktop/tests/*.cjs; do
            node --check "$file"
          done
      - name: Run desktop and repo parity tests
        run: |
          node --test desktop/tests/*.test.cjs
          node --test tests/native-desktop-preview.test.mjs tests/native-site-parity.test.mjs

  windows:
    name: Windows x64 preview installer
    runs-on: windows-latest
    needs: safety
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install desktop dependencies
        run: npm install --prefix desktop --no-audit --no-fund
      - name: Stage verified official sing-box Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-windows-amd64.zip'
          $expected = 'c2d8bfff918755808781dfdeeb8581b6c91eb3a243d9a7b55483cfc0c0684d32'
          $archive = Join-Path $env:RUNNER_TEMP 'sing-box.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'sing-box-unpacked'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'sing-box archive SHA256 mismatch' }
          Expand-Archive -Path $archive -DestinationPath $extract
          $binary = Get-ChildItem -Path $extract -Filter sing-box.exe -Recurse -File | Select-Object -First 1
          if (-not $binary) { throw 'sing-box.exe not found in official archive' }
          New-Item -ItemType Directory -Force -Path 'desktop/vendor/sing-box/windows-x64' | Out-Null
          Copy-Item $binary.FullName 'desktop/vendor/sing-box/windows-x64/sing-box.exe'
      - name: Smoke-test verified sing-box executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = Join-Path (Get-Location) 'desktop/vendor/sing-box/windows-x64/sing-box.exe'
          if (-not (Test-Path $engine)) { throw 'Bundled engine not found' }
          & $engine version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled sing-box executable failed smoke test' }
      - name: Check generated TUN configuration
        shell: pwsh
        run: |
          $engine = Join-Path (Get-Location) 'desktop/vendor/sing-box/windows-x64/sing-box.exe'
          node desktop/scripts/check-engine-config.cjs $engine
      - name: Build Windows NSIS installer
        run: npm run --prefix desktop dist:win
      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: vainah-windows-ui-preview
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS Intel and Apple Silicon previews
    runs-on: macos-latest
    needs: safety
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install desktop dependencies
        run: npm install --prefix desktop --no-audit --no-fund
      - name: Build macOS DMG for both architectures
        run: npm run --prefix desktop dist:mac
      - name: Upload macOS previews
        uses: actions/upload-artifact@v4
        with:
          name: vainah-macos-ui-preview
          path: desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Windows GitHub prerelease (independent of macOS)
    runs-on: ubuntu-latest
    needs: [safety, windows]
    permissions:
      contents: write
    # Never publish installers from untrusted forks or PRs.
    if: github.repository == 'isaevarbi822-hub/Vainahvpn_bot' && github.ref == 'refs/heads/feature/native-ios-android-vpn-foundation'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vainah-windows-ui-preview
          path: preview
          merge-multiple: true
      - name: Check Windows installer and checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(preview/*.exe)
          [[ ${#files[@]} -ge 1 ]] || { echo "Windows installer required"; exit 1; }
          for file in "${files[@]}"; do test -s "$file"; done
          cd preview
          sha256sum *.exe > SHA256SUMS.txt
      - name: Publish explicitly labeled prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="desktop-windows-preview-v0.4.4-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          cat > /tmp/VainahDesktopNotes.md <<'NOTES'
          # Vainah VPN Desktop 0.4.4 — Windows engineering preview

          **ВНИМАНИЕ: ЭТА СБОРКА НЕ ПОДКЛЮЧАЕТ VPN И НЕ ЗАЩИЩАЕТ ТРАФИК.**
          Windows x64: предварительный установщик. Поддержка sing-box и H1Cloud ещё проходит интеграцию и тестирование.
          macOS собирается отдельным заданием GitHub Actions и не блокирует публикацию Windows.
          Проверяйте успешность workflow, SHA256SUMS и цифровую подпись до установки.
          **Этот установщик не подписан и предназначен для разработки, а не для массового использования.**
          NOTES
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This exact workflow attempt has already been published; refusing to overwrite its binaries."
            exit 1
          fi
          gh release create "$tag" preview/*.exe preview/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Vainah VPN Desktop 0.4.4 — Windows (инженерный preview, VPN не подтверждён)" \
            --notes-file /tmp/VainahDesktopNotes.md \
            --prerelease --latest=false
