name: Vainah VPN four-platform integration previews

on:
  push:
    branches:
      - feature/vpn-scale-control-plane-foundation
    paths:
      - "desktop/**"
      - "native/**"
      - "site/**"
      - "services/control-plane/**"
      - "tests/control-plane-device-policy.test.mjs"
      - "tests/check-android-reality-schema.cjs"
      - ".github/workflows/four-platform-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vainah-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify account policy and exact website copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/control-plane-device-policy.test.mjs tests/profile-format.test.mjs tests/reality-compat.test.mjs tests/engine-readiness.test.mjs tests/singbox-reality-adapter.test.mjs tests/desktop-tun-config.test.mjs
      - run: node --test desktop/tests/*.test.cjs
      - name: Check experimental TCP Reality TUN config with pinned sing-box
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3             'https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-linux-amd64.tar.gz' -o /tmp/vainah-singbox.tgz
          echo 'e2bdf179c15a3652955dc44867e33ca0965c9c9b91b34267dcc5a5d639a5feee  /tmp/vainah-singbox.tgz' | sha256sum --check
          tar -xzf /tmp/vainah-singbox.tgz -C /tmp
          # Validate the actual Electron runtime builder, not only the
          # independent control-plane prototype. Dummy values only.
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createRequire} from 'node:module';
          import {createDesktopTunConfig} from './services/control-plane/desktop-tun-config.mjs';
          const require=createRequire(import.meta.url);
          const {fromSubscriptionText,toTunConfig}=require('./desktop/shared/engine-config.cjs');
          const link='vless://123e4567-e89b-42d3-a456-426614174000@vpn.example.org:443?security=reality&type=tcp&sni=www.example.org&pbk=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA&sid=abcd&fp=chrome';
          for(const platform of ['darwin','win32']){
            fs.writeFileSync(`/tmp/vainah-prototype-${platform}.json`,
              JSON.stringify(createDesktopTunConfig(link,platform)));
            fs.writeFileSync(`/tmp/vainah-runtime-${platform}.json`,
              JSON.stringify(toTunConfig(fromSubscriptionText(link),platform)));
          }
          JS
          for platform in darwin win32; do
            /tmp/sing-box-1.14.3-linux-amd64/sing-box check -c "/tmp/vainah-prototype-${platform}.json"
            /tmp/sing-box-1.14.3-linux-amd64/sing-box check -c "/tmp/vainah-runtime-${platform}.json"
          done
          node tests/check-android-reality-schema.cjs /tmp/sing-box-1.14.3-linux-amd64/sing-box

      - run: node --test tests/native-mobile-foundation.test.mjs tests/native-site-parity.test.mjs

  android:
    name: Android debug APK — UI only
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle -p native/android :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VainahVPN-Android-integration-${{ github.run_number }}-no-tunnel
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS simulator compile — no distributable IPA
    runs-on: macos-latest
    needs: verify
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - run: swift native/ios/scripts/generate-icon.swift
      - run: cd native/ios && xcodegen generate
      - run: >
          xcodebuild
          -project native/ios/VainahVPN.xcodeproj
          -scheme VainahVPN
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build-for-testing

  windows:
    name: Windows test installer — UI only
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix desktop --no-audit --no-fund
      - run: npm run --prefix desktop dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: VainahVPN-Windows-integration-${{ github.run_number }}-no-tunnel
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS test DMGs — UI only
    runs-on: macos-latest
    needs: verify
    timeout-minutes: 50
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix desktop --no-audit --no-fund
      - run: npm run --prefix desktop dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: VainahVPN-macOS-integration-${{ github.run_number }}-no-tunnel
          path: desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 7

# No release/publishing job: these are unsigned integration artifacts.
# Production Netlify and payment services are not deployed or altered.
