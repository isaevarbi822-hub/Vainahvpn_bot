name: Vainah VPN four-platform integration previews

on:
  push:
    branches:
      - feature/vpn-scale-control-plane-foundation
    paths:
      - "desktop/**"
      - "native/**"
      - "site/**"
      - "services/control-plane/**"
      - "tests/control-plane-device-policy.test.mjs"
      - "tests/check-android-reality-schema.cjs"
      - ".github/workflows/four-platform-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vainah-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify account policy and exact website copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/control-plane-device-policy.test.mjs tests/profile-format.test.mjs tests/reality-compat.test.mjs tests/engine-readiness.test.mjs tests/singbox-reality-adapter.test.mjs tests/desktop-tun-config.test.mjs
      - run: node --test desktop/tests/*.test.cjs
      - name: Prevent repeat iOS libbox linker-script regressions
        run: python3 tests/ios-libbox-manifest.test.py
      - name: Check experimental TCP Reality TUN config with pinned sing-box
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3             'https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-linux-amd64.tar.gz' -o /tmp/vainah-singbox.tgz
          echo 'e2bdf179c15a3652955dc44867e33ca0965c9c9b91b34267dcc5a5d639a5feee  /tmp/vainah-singbox.tgz' | sha256sum --check
          tar -xzf /tmp/vainah-singbox.tgz -C /tmp
          # Validate the actual Electron runtime builder, not only the
          # independent control-plane prototype. Dummy values only.
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createRequire} from 'node:module';
          import {createDesktopTunConfig} from './services/control-plane/desktop-tun-config.mjs';
          const require=createRequire(import.meta.url);
          const {fromSubscriptionText,toTunConfig}=require('./desktop/shared/engine-config.cjs');
          const link='vless://123e4567-e89b-42d3-a456-426614174000@vpn.example.org:443?security=reality&type=tcp&sni=www.example.org&pbk=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA&sid=abcd&fp=chrome';
          for(const platform of ['darwin','win32']){
            fs.writeFileSync(`/tmp/vainah-prototype-${platform}.json`,
              JSON.stringify(createDesktopTunConfig(link,platform)));
            fs.writeFileSync(`/tmp/vainah-runtime-${platform}.json`,
              JSON.stringify(toTunConfig(fromSubscriptionText(link),platform)));
            // Validate a distinct H1Cloud gRPC Reality profile against the
            // stock pinned sing-box engine; network I/O is NOT exercised.
            const grpc=link.replace('type=tcp','type=grpc')+'&serviceName=vainah-svc';
            fs.writeFileSync(`/tmp/vainah-grpc-${platform}.json`,
              JSON.stringify(createDesktopTunConfig(grpc,platform)));
          }
          JS
          for platform in darwin win32; do
            /tmp/sing-box-1.14.3-linux-amd64/sing-box check -c "/tmp/vainah-prototype-${platform}.json"
            /tmp/sing-box-1.14.3-linux-amd64/sing-box check -c "/tmp/vainah-runtime-${platform}.json"
            /tmp/sing-box-1.14.3-linux-amd64/sing-box check -c "/tmp/vainah-grpc-${platform}.json"
          done
          node tests/check-android-reality-schema.cjs /tmp/sing-box-1.14.3-linux-amd64/sing-box

      - run: node --test tests/native-mobile-foundation.test.mjs tests/native-site-parity.test.mjs

  android:
    name: Android debug APK — UI only
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle -p native/android :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VainahVPN-Android-integration-${{ github.run_number }}-no-tunnel
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS simulator compile — no distributable IPA
    runs-on: macos-latest
    needs: verify
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - run: swift native/ios/scripts/generate-icon.swift
      - run: cd native/ios && xcodegen generate
      - run: >
          xcodebuild
          -project native/ios/VainahVPN.xcodeproj
          -scheme VainahVPN
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build-for-testing
      - name: Run native iOS XCTest on an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          devices=json.load(sys.stdin).get("devices",{})
          iphones=[d for group in devices.values() for d in group
                   if d.get("isAvailable") and d.get("name","").startswith("iPhone")]
          print(iphones[0]["udid"] if iphones else "")
          ')
          if [ -z "$SIMULATOR" ]; then
            echo "No iPhone simulator on the runner; native tests cannot be verified"
            exit 1
          fi
          xcodebuild \
            -project native/ios/VainahVPN.xcodeproj \
            -scheme VainahVPN \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:VainahVPNTests \
            test

  windows:
    name: Windows test installer — real core (VPN unverified)
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix desktop --no-audit --no-fund
      - name: Bundle upstream sing-box 1.14.3 Windows x64 (SHA-256 pinned)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-windows-amd64.zip"
          $archive = Join-Path $env:RUNNER_TEMP "singbox-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "d8b86ef58936dba9230ec6a57ffa4243933f3c14ef4809828b6c553440ed1518") {
            throw "Upstream sing-box release digest mismatch"
          }
          $unpack = Join-Path $env:RUNNER_TEMP "singbox-windows"
          Expand-Archive $archive -DestinationPath $unpack
          $binary = Get-ChildItem -Path $unpack -Filter sing-box.exe -File -Recurse | Select-Object -First 1
          if (-not $binary) { throw "Expected sing-box.exe missing" }
          New-Item -ItemType Directory -Path desktop/engines -Force | Out-Null
          Copy-Item $binary.FullName desktop/engines/sing-box.exe
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/SagerNet/sing-box/v1.14.3/LICENSE" -OutFile desktop/engines/sing-box-GPL-3.0.txt
          if ((Get-Item desktop/engines/sing-box.exe).Length -le 1000000) { throw "Core too small" }
      - run: npm run --prefix desktop dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: VainahVPN-Windows-integration-${{ github.run_number }}-unverified-core
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS test DMGs — real core (VPN unverified)
    runs-on: macos-latest
    needs: verify
    timeout-minutes: 50
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix desktop --no-audit --no-fund
      - name: Bundle upstream sing-box 1.14.3 macOS universal variants (SHA-256 pinned)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop/engines
          for arch in amd64 arm64; do
            file="$RUNNER_TEMP/sing-box-1.14.3-darwin-$arch.tar.gz"
            curl --fail --location --silent --show-error --retry 3               "https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-darwin-$arch.tar.gz" -o "$file"
            if [ "$arch" = amd64 ]; then
              digest="6d002b74d03b478547349cc10af89e007868596e5aa931816d45da9f544715a9"
            else
              digest="0360ce634a04c26a6b4fd957517987bb4f6c8950f63435ce3c5af2fcae5860c5"
            fi
            echo "$digest  $file" | shasum -a 256 -c -
            tar -xzf "$file" -C "$RUNNER_TEMP"
            src="$RUNNER_TEMP/sing-box-1.14.3-darwin-$arch/sing-box"
            test -s "$src"
            cp "$src" "desktop/engines/sing-box-darwin-$arch"
            chmod 755 "desktop/engines/sing-box-darwin-$arch"
          done
          curl --fail --location --silent --show-error             "https://raw.githubusercontent.com/SagerNet/sing-box/v1.14.3/LICENSE"             -o desktop/engines/sing-box-GPL-3.0.txt
      - run: npm run --prefix desktop dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: VainahVPN-macOS-integration-${{ github.run_number }}-unverified-core
          path: desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 7

# No release/publishing job: these are unsigned integration artifacts.
# Production Netlify and payment services are not deployed or altered.
