name: Python host smoke tests
on:
  pull_request:
    paths:
      - 'python_server/**'
      - 'Dockerfile.python'
      - '.github/workflows/python-host.yml'
      - 'site/**'
      - 'netlify/functions/**'
  push:
    branches: ['migration/python-host']
permissions:
  contents: read
jobs:
  python-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          python -m pip install -r python_server/requirements.txt pytest
      - name: Python and Node syntax
        run: |
          python -m py_compile python_server/main.py
          node --check python_server/legacy_bridge.mjs
      - name: Run legacy Node and frontend regression tests
        run: npm test
      - name: Run safe read-only smoke tests
        env:
          PUBLIC_SITE_ORIGIN: http://127.0.0.1:8000
          VAINAH_LIVE_CHECKOUT: disabled
          VAINAH_PAYMENT_INTEGRATION_VERIFIED: not-verified
        run: python -m pytest -q python_server/tests

      - name: Build preview Docker image
        run: docker build -f Dockerfile.python -t vainah-python-preview:test .
      - name: Check preview container health and plans
        run: |
          docker run -d --rm --name vainah-python-smoke -p 127.0.0.1:18888:8000 -e PUBLIC_SITE_ORIGIN=http://127.0.0.1:8000 -e VAINAH_LIVE_CHECKOUT=disabled -e VAINAH_PAYMENT_INTEGRATION_VERIFIED=not-verified vainah-python-preview:test
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18888/api/health && curl -fsS http://127.0.0.1:18888/.netlify/functions/subscription-plans; then
              exit 0
            fi
            sleep 2
          done
          docker logs vainah-python-smoke
          exit 1
