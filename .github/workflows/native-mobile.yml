name: Vainah VPN native mobile

on:
  pull_request:
    paths:
      - "native/**"
      - "tests/native-mobile-foundation.test.mjs"
      - ".github/workflows/native-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-safety:
    name: Cross-platform source and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/native-mobile-foundation.test.mjs

  android:
    name: Android debug build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build and test Android
        run: gradle -p native/android :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

  ios:
    name: iOS Simulator unsigned compile
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        working-directory: native/ios
        run: xcodegen generate
      - name: Compile iOS app and Packet Tunnel extension for simulator
        run: >
          xcodebuild
          -project native/ios/VainahVPN.xcodeproj
          -scheme VainahVPN
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
