name: Vainah VPN native mobile

on:
  push:
    branches:
      - feature/native-ios-android-vpn-foundation
    paths:
      - "native/**"
      - "tests/native-mobile-foundation.test.mjs"
      - ".github/workflows/native-mobile.yml"
  pull_request:
    paths:
      - "native/**"
      - "tests/native-mobile-foundation.test.mjs"
      - ".github/workflows/native-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-safety:
    name: Cross-platform source and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/native-mobile-foundation.test.mjs

  android:
    name: Android debug build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Generated by a local JVM test from invented credentials only.
      VAINAH_SYNTHETIC_CONFIG_OUTPUT: ${{ github.workspace }}/native/android/app/build/checked-synthetic-singbox.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub Ubuntu hosted runners ship the Android SDK; the upstream
      # setup-android v3 currently tries to install the retired SDK "tools" package.
      - name: Inspect preinstalled SDK
        run: |
          test -d "${ANDROID_HOME}/platforms" || exit 1
          ls "${ANDROID_HOME}/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build and test Android
        run: gradle -p native/android :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Validate generated VPN config with pinned sing-box v1.14.0
        shell: bash
        run: |
          set -euo pipefail
          test -s "$VAINAH_SYNTHETIC_CONFIG_OUTPUT"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 150 \
            "https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz" \
            -o "$tmp/sing-box.tar.gz"
          # SHA-256 from upstream GitHub release asset metadata (not a mutable tag).
          echo "2375de6999f4f56ab46b4fc5ddf26a6aba1d3e61a0f4e7ddec2f4690457d5f63  $tmp/sing-box.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/sing-box.tar.gz" -C "$tmp"
          cli="$(find "$tmp" -type f -name sing-box -print -quit)"
          test -n "$cli"
          chmod +x "$cli"
          "$cli" version
          # 'check' parses and validates the real JSON produced by Kotlin,
          # without opening a TUN or contacting a subscription.
          "$cli" check -c "$VAINAH_SYNTHETIC_CONFIG_OUTPUT"
      - name: Upload Android UI preview (no VPN transport)
        uses: actions/upload-artifact@v4
        with:
          name: vainahvpn-android-ui-preview-no-tunnel
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7


  libbox-compat:
    name: Android experimental libbox dependency compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Resolve libbox Android binary and compile experimental APK
        run: >
          gradle -p native/android
          -PvainahEnableLibbox=true
          :app:assembleDebug
          --no-daemon --stacktrace
      - name: Inspect libbox Java bridge API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libbox-api-report
          aar_path=$(find "$HOME/.gradle/caches" -type f -name 'libbox*.aar' -print -quit)
          test -n "$aar_path"
          unzip -p "$aar_path" classes.jar > /tmp/vainah-libbox-classes.jar
          test -s /tmp/vainah-libbox-classes.jar
          jar tf /tmp/vainah-libbox-classes.jar > libbox-api-report/classes.txt
          echo 'libbox public API:'
          while IFS= read -r cls; do
            case "$cls" in
              io/nekohasekai/libbox/*.class)
                name="${cls%.class}"
                name="${name//\\//.}"
                javap -classpath /tmp/vainah-libbox-classes.jar -public "$name" 2>/dev/null || true
                ;;
            esac
          done < libbox-api-report/classes.txt > libbox-api-report/signatures.txt
          grep -E 'public (class|interface|static|.*Service|.*Platform|.*Command)' libbox-api-report/signatures.txt | head -n 170 || true

          test -s libbox-api-report/classes.txt
          echo "Inspect classes.txt for library API surface. No user credentials are recorded." > libbox-api-report/README.txt
      - name: Upload libbox class index
        uses: actions/upload-artifact@v4
        with:
          name: vainah-libbox-experimental-api-report
          path: libbox-api-report/
          retention-days: 7
      # Isolated debugging artifact: never substitute for the stable UI preview.
      # Runtime VPN transport and leak prevention have NOT been verified on a device.
      - name: Upload experimental Android VPN engine APK
        uses: actions/upload-artifact@v4
        with:
          name: vainahvpn-android-experimental-libbox-tun-unverified
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  clerk-compat:
    name: Android optional Clerk native SDK compile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile Clerk auth UI with synthetic public test key
        run: >
          gradle -p native/android
          -PvainahEnableClerk=true
          -PvainahIsolatedPreview=true
          -PvainahClerkPublishableKey="${{ vars.VAINAH_CLERK_PUBLISHABLE_KEY || secrets.VAINAH_CLERK_PUBLISHABLE_KEY || secrets.CLERK_PUBLISHABLE_KEY || 'pk_test_synthetic_ci_only_not_a_real_instance' }}"
          :app:assembleDebug
          --no-daemon --stacktrace
      # A publishable Clerk key is public and may be supplied in GitHub Actions
      # repository variables. Without it, this APK displays the new UI but
      # CANNOT authenticate to a real Clerk instance. Never use secret keys here.
      - name: Upload Clerk login UI preview APK (payment disabled)
        uses: actions/upload-artifact@v4
        with:
          name: vainahvpn-android-0.5.2-clerk-auth-preview
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  combined-vpn-clerk-compat:
    name: Android combined libbox and Clerk source compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # The synthetic PUBLIC key is permitted for COMPILE checks only.
      # No APK gets uploaded, since sign-in would not work with this key.
      - name: Compile both VPN engine and Clerk without publishing a fake-login APK
        run: >
          gradle -p native/android
          -PvainahEnableLibbox=true
          -PvainahEnableClerk=true
          -PvainahIsolatedPreview=true
          -PvainahClerkPublishableKey=pk_test_synthetic_ci_only_not_a_real_instance
          :app:assembleDebug :app:testDebugUnitTest
          --no-daemon --stacktrace

  full-vpn-clerk-preview:
    name: Android VPN engine + real Clerk auth APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # PUBLISHABLE (public) key only. GitHub repository variables are preferred.
      CLERK_PUBLIC_KEY: \${{ vars.VAINAH_CLERK_PUBLISHABLE_KEY || vars.CLERK_PUBLISHABLE_KEY || secrets.VAINAH_CLERK_PUBLISHABLE_KEY || secrets.CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Require real Clerk publishable key (no fake auth builds)
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re,base64,sys
          value=os.environ.get("CLERK_PUBLIC_KEY","")
          match=re.fullmatch(r'pk_(?:test|live)_([A-Za-z0-9_=-]{12,512})',value)
          try:
              domain=base64.urlsafe_b64decode(match.group(1)+'='*((-len(match.group(1)))%4)).decode('ascii') if match else ''
          except (ValueError,UnicodeError):
              domain=''
          if not domain.endswith('$') or '.' not in domain or len(domain)>254:
              print("CONFIGURATION REQUIRED: set a genuine Clerk publishable key (pk_test_/pk_live_) in GitHub Actions variable VAINAH_CLERK_PUBLISHABLE_KEY. Synthetic keys are not accepted.",file=sys.stderr)
              sys.exit(1)
          print("Real-format Clerk PUBLIC key validated. Account login still requires native app configuration and real-device testing.")
          PY
      - name: Compile one APK with both libbox VPN and Clerk
        shell: bash
        run: |
          set -euo pipefail
          gradle -p native/android \
            -PvainahEnableLibbox=true \
            -PvainahEnableClerk=true \
            -PvainahIsolatedPreview=true \
            -PvainahClerkPublishableKey="$CLERK_PUBLIC_KEY" \
            :app:assembleDebug :app:testDebugUnitTest \
            --no-daemon --stacktrace
          test -s native/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload single combined Vainah VPN 0.5.3 Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: VainahVPN-0.5.3-Android-VPN-libbox-Clerk-preview
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS Simulator unsigned compile
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Vainah website-matching app icon
        run: swift native/ios/scripts/generate-icon.swift
      - name: Generate Xcode project
        working-directory: native/ios
        run: xcodegen generate
      - name: Compile iOS app and Packet Tunnel extension for simulator
        run: >
          xcodebuild
          -project native/ios/VainahVPN.xcodeproj
          -scheme VainahVPN
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
