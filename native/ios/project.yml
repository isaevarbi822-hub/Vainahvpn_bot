name: VainahVPN
options:
  bundleIdPrefix: app.vainah
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  VainahVPN:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - Sources/Shared
    info:
      path: Generated/AppInfo.plist
      properties:
        CFBundleDisplayName: Vainah VPN
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: Generated/App.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.app.vainah.vpn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vainah.vpn
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: VainahPacketTunnel
        embed: true

  VainahPacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Sources/TunnelExtension
      # Compile the same private config builder in the packet provider.
      # Do not add the app Keychain store until secure sharing is reviewed.
      - Sources/Shared/MobileRealityConfig.swift
    info:
      path: Generated/PacketTunnelInfo.plist
      properties:
        CFBundleDisplayName: Vainah VPN Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
    entitlements:
      path: Generated/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.app.vainah.vpn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vainah.vpn.PacketTunnel
        GENERATE_INFOPLIST_FILE: NO

  VainahVPNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: VainahVPN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vainah.vpn.tests
