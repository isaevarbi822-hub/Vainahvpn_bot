# Vainah VPN free hosting preview (no production payments).
services:
  - type: web
    name: vainahvpn-python-preview
    runtime: docker
    plan: free
    region: frankfurt
    branch: migration/python-host
    dockerfilePath: ./Dockerfile.python
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: VAINAH_LIVE_CHECKOUT
        value: disabled
      - key: VAINAH_PAYMENT_INTEGRATION_VERIFIED
        value: not-verified
