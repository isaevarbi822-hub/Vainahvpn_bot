<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Rollypay Sandbox — Vainah VPN</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 10%,#473178,#0b0e1c 55%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px}
main{max-width:600px;margin:65px auto;background:#181b2c;border:1px solid #4a4367;border-radius:26px;padding:30px}
h1{font-size:27px;margin:6px 0}p{color:#bcc0d9;line-height:1.6}
label{display:block;margin:22px 0 8px;font-weight:700}
input{width:100%;padding:15px;background:#0b1020;border:1px solid #665c82;border-radius:12px;color:#fff;font:inherit}
button,.button{display:inline-block;background:#b69cff;border:0;border-radius:12px;padding:14px 18px;color:#201437;font-weight:800;text-decoration:none;font:inherit;cursor:pointer;margin:16px 10px 0 0}
button:disabled{opacity:.5;cursor:wait}
pre{white-space:pre-wrap;word-break:break-word;background:#0b0f1d;padding:18px;border-radius:12px;margin-top:20px;min-height:60px}
small{color:#c8bbf3}a{color:#cebaff}
</style>
</head>
<body>
<main>
<small>VAINAH VPN / ТОЛЬКО АДМИНИСТРАТОРУ</small>
<h1>Тест оплаты Rollypay</h1>
<p>Это sandbox. <strong>Настоящих списаний денег и выдачи VPN здесь нет.</strong> Пожалуйста, не проводи настоящую оплату.</p>
<label for="token">Тестовый пароль ROLLYPAY_TEST_TOKEN</label>
<input id="token" type="password" autocomplete="off" placeholder="Пароль из Netlify Environment variables">
<div>
<button id="create" type="button">Создать тестовый платёж</button>
<button id="check" type="button" disabled>Проверить статус</button>
</div>
<p id="link"></p>
<pre id="output" aria-live="polite">Ожидание теста.</pre>
<p><a href="/">← Вернуться на Vainah VPN</a></p>
</main>
<script>
(() => {
  const token = document.getElementById('token');
  const create = document.getElementById('create');
  const check = document.getElementById('check');
  const output = document.getElementById('output');
  const link = document.getElementById('link');
  let paymentId = '';
  async function call(method, url) {
    const response = await fetch(url, {method, headers:{'x-vainah-test-token': token.value}, cache:'no-store'});
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || 'HTTP ' + response.status);
    return data;
  }
  create.addEventListener('click',async () => {
    if (token.value.length < 24) { output.textContent = 'Введите тестовый пароль длиной не менее 24 символов.'; return; }
    create.disabled = true; link.textContent = ''; check.disabled = true; output.textContent = 'Создание тестового платежа...';
    try {
      const payment = await call('POST','/.netlify/functions/rollypay-test');
      paymentId = payment.paymentId;
      check.disabled = false;
      output.textContent = 'Создан SANDBOX-платёж: ' + paymentId + '\nСтатус: ' + payment.status;
      const a = document.createElement('a');
      a.href = payment.payUrl; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.textContent = 'Открыть тестовую страницу Rollypay ↗';
      link.appendChild(a);
    } catch (e) { output.textContent = 'Ошибка: ' + e.message; }
    finally { create.disabled = false; }
  });
  check.addEventListener('click',async () => {
    if (!paymentId) return;
    check.disabled = true;
    try {
      const payment = await call('GET','/.netlify/functions/rollypay-test?paymentId='+encodeURIComponent(paymentId));
      output.textContent = 'SANDBOX-платёж: ' + paymentId + '\nСтатус: ' + payment.status;
    } catch (e) { output.textContent = 'Ошибка: ' + e.message; }
    finally { check.disabled = false; }
  });
})();
</script>
</body>
</html>
